        </tr>
      </thead>
      <tbody>
        <sc-for list="{{ credits }}" as="c" hint-placeholder-count="16">
          <tr style="border-bottom: 1px solid #ddd9cc; break-inside: avoid;">
            <td style="padding: 10px 12px 10px 0; vertical-align: top;">{{ c.role }}</td>
            <td style="padding: 10px 12px 10px 0; vertical-align: top;">
              <div style="font-family: 'Bebas Neue', Helvetica, sans-serif; font-size: 15px; line-height: 1.2;">{{ c.title }}</div>
              <div style="font-size: 9px; letter-spacing: 0.08em; color: #57544a; margin-top: 2px;">{{ c.studio }}</div>
            </td>
            <td style="padding: 10px 12px 10px 0; vertical-align: top; color: #57544a;">{{ c.format }}</td>
            <td style="padding: 10px 0; vertical-align: top; color: #57544a; white-space: nowrap;">{{ c.dates }}</td>
          </tr>
        </sc-for>
      </tbody>
    </table>
  </div>
</doc-page>
